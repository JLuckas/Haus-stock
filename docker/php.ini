; Haus Stock production overrides (loaded after php.ini-production).
expose_php = Off
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 8M
date.timezone = America/Sao_Paulo

; The code never changes inside a running container: cache compiled PHP for good.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
