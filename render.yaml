# Render Blueprint: Render → New → Blueprint → pick this repository.
# Settings marked `sync: false` are secrets: Render asks for them when the Blueprint is created
# (copy them from .env.production, which stays out of git).
services:
  - type: web
    name: haus-stock
    runtime: docker
    dockerfilePath: ./Dockerfile
    # The Neon database is in São Paulo; Render has no South American region, Virginia is the closest.
    region: virginia
    # Free instances sleep after 15 min idle and take ~1 min to wake: too slow for order webhooks.
    plan: starter
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      # Secrets
      - key: APP_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: APP_URL
        sync: false
      # First login, created on the first deploy (remove ADMIN_PASSWORD afterwards)
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # App
      - key: APP_NAME
        value: Haus Stock
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: APP_LOCALE
        value: pt_BR
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_FAKER_LOCALE
        value: pt_BR
      - key: APP_MAINTENANCE_DRIVER
        value: file
      - key: BCRYPT_ROUNDS
        value: "12"

      # Logs go to Render's log viewer
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: LOG_DEPRECATIONS_CHANNEL
        value: "null"

      # Database (Neon Postgres)
      - key: DB_CONNECTION
        value: pgsql

      # Sessions, cache and queue in Postgres
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: CACHE_PREFIX
        value: haus_stock_
      - key: QUEUE_CONNECTION
        value: sync

      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log

      # Business
      - key: PROFITABILITY_HEALTHY_MARGIN
        value: "65"
